allprojects { afterEvaluate {
    tasks.register('stutterRepairTest', Test) {
        dependsOn tasks.named('testClasses')
        testClassesDirs=sourceSets.test.output.classesDirs;classpath=sourceSets.test.runtimeClasspath
        useJUnitPlatform()
        include '**/PredictionStutterRepairTest.class'
        include '**/VoxySectionSignatureTest.class'
        include '**/PredictionVoxySourceTest.class','**/PredictionVoxyLoadingIntegrationTest.class'
        include '**/VoxyPredictionNotificationTest.class','**/PredictionVoxyDetailQueueTest.class'
        forkEvery=1;maxHeapSize='2G'
        testLogging {events 'failed','skipped';exceptionFormat 'full';showStandardStreams=true}
    }
} }
