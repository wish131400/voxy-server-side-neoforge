allprojects { afterEvaluate {
    tasks.register('dataOrientedTest', Test) {
        dependsOn tasks.named('testClasses')
        testClassesDirs=sourceSets.test.output.classesDirs;classpath=sourceSets.test.runtimeClasspath
        useJUnitPlatform()
        include '**/PredictionTileStatesTest.class','**/PredictionSchedulingFactsTest.class'
        include '**/PredictionPackedVegetationTest.class','**/PredictionDataOrientedPerformanceTest.class'
        include '**/VoxyNotificationScratchTest.class'
        forkEvery=1;maxHeapSize='2G'
        testLogging { events 'failed','skipped';exceptionFormat 'full';showStandardStreams=true }
    }
} }
