allprojects {
 afterEvaluate {
  tasks.register('pipelineCostTest', Test) {
   dependsOn tasks.named('testClasses')
   testClassesDirs=sourceSets.test.output.classesDirs
   classpath=sourceSets.test.runtimeClasspath
   useJUnitPlatform()
   include '**/PredictionInputSnapshotsTest.class', '**/PredictionMemoryBudgetTest.class'
   include '**/PredictionVoxyPreparationTest.class', '**/PredictionVoxySourceTest.class'
   include '**/PredictionPipelineReplayTest.class', '**/PredictionPlanningPipelineTest.class'
   forkEvery=1
   maxHeapSize='2G'
   testLogging { events 'failed','skipped';exceptionFormat 'full';showStandardStreams=true }
  }
 }
}
