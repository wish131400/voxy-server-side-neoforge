allprojects {
    afterEvaluate {
        tasks.register('neighborVariantTest', Test) {
            dependsOn tasks.named('testClasses')
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            useJUnitPlatform()
            include '**/VoxyNeighborVariantMixinTest.class'
            maxHeapSize = '2G'
            systemProperty 'vss.voxyJar', providers.gradleProperty('vssVoxyJar').getOrElse('')
            testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
        }
        tasks.register('turnStabilityTest', Test) {
            dependsOn tasks.named('testClasses')
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            useJUnitPlatform()
            include '**/PredictionTurnStabilityTest.class', '**/ConcurrentPositionSetTest.class'
            include '**/PredictionScopeFamiliesTest.class', '**/PredictionInputSnapshotsTest.class'
            include '**/LodRequestManagerStrictOrderTest.class', '**/LodRequestManagerCacheProbeMissTest.class'
            include '**/VoxySectionDataTest.class', '**/PredictionVoxyDetailQueueTest.class'
            include '**/PredictionVoxySourceTest.class', '**/VoxyPredictionNotificationTest.class'
            forkEvery = 1
            maxHeapSize = '2G'
            testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
        }
    }
}
