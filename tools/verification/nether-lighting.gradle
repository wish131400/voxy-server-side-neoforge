allprojects {
    afterEvaluate {
        tasks.register('netherLightingTest', Test) {
            dependsOn tasks.named('testClasses')
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            useJUnitPlatform()
            include '**/PredictionVoxyLightingTest.class', '**/VoxyPredictionLightingTest.class'
            include '**/PredictionVoxySourceTest.class', '**/VoxyPredictionBridgeTest.class'
            include '**/VoxyRealAirAuthorityTest.class', '**/VoxyPredictionNotificationTest.class'
            include '**/VoxySurfaceHeightsTest.class', '**/VoxyMergeLocalityTest.class'
            forkEvery = 1
            maxHeapSize = '2G'
            systemProperty 'vss.voxyJar', providers.gradleProperty('vssVoxyJar').get()
            testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
        }
    }
}
