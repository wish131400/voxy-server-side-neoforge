allprojects { afterEvaluate {
 tasks.register('pipelineFollowupTest', Test) {
  dependsOn tasks.named('testClasses');testClassesDirs=sourceSets.test.output.classesDirs;classpath=sourceSets.test.runtimeClasspath
  useJUnitPlatform()
  include '**/PredictionInputSnapshotsTest.class','**/PredictionVoxyPreparationTest.class','**/PredictionPipelineReplayTest.class'
  include '**/RustDimensionBoundsTest.class','**/RustVegetationStageTest.class','**/RustVegetationDeltaUploadTest.class'
  include '**/PredictionNetherDecorationTest.class','**/RustDisplayGridReuseTest.class','**/RustDecorationReuseTest.class'
  forkEvery=1;maxHeapSize='2G';testLogging {events 'failed','skipped';exceptionFormat 'full';showStandardStreams=true}
 }
} }
