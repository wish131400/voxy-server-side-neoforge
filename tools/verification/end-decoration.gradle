allprojects {
    afterEvaluate {
        tasks.register('endDecorationTest', Test) {
            dependsOn tasks.named('testClasses')
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            useJUnitPlatform()
            include '**/FabricBiomeCompatTest.class', '**/PredictionBiomeCacheTest.class'
            include '**/PredictionEndDecorationTest.class', '**/PredictionEndColumnsTest.class'
            forkEvery = 1
            maxHeapSize = '2G'
            testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
        }
    }
}
