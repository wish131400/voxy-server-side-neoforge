allprojects {
    afterEvaluate {
        tasks.register('sparkCpuTest', Test) {
            dependsOn tasks.named('testClasses')
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            useJUnitPlatform()
            include '**/PredictionInputSnapshotsTest.class', '**/StrictLodFrontierTest.class'
            include '**/VoxySectionPrunerTest.class', '**/VoxySectionVersionsTest.class'
            include '**/VoxyPredictionNotificationTest.class', '**/PredictionTurnStabilityTest.class'
            forkEvery = 1
            maxHeapSize = '2G'
            testLogging { events 'failed', 'skipped'; exceptionFormat 'full'; showStandardStreams = true }
        }
    }
}
