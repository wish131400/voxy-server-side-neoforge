allprojects {
    afterEvaluate {
        tasks.register('nearFirstTest', Test) {
            dependsOn tasks.named('testClasses')
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            useJUnitPlatform()
            ['PredictionNearFirstSchedulingTest','PredictionProgressiveLoadingTest',
             'PredictionDetailBandsTest','PredictionViewSelectionTest','PredictionScreenDetailTest','PredictionMotionPaceTest'].each {
                include "**/${it}.class"
            }
            maxHeapSize = '3G'
            maxParallelForks = 1
            forkEvery = 1
            testLogging { events 'failed','skipped'; exceptionFormat 'full' }
        }
    }
}
