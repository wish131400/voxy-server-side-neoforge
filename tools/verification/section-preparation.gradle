allprojects {
    afterEvaluate {
        tasks.register('sectionPreparationTest', Test) {
            dependsOn tasks.named('testClasses')
            testClassesDirs=sourceSets.test.output.classesDirs
            classpath=sourceSets.test.runtimeClasspath
            useJUnitPlatform()
            include '**/PredictionVoxyPreparationTest.class', '**/VoxySectionDataTest.class'
            include '**/VoxyPredictionBridgeTest.class', '**/VoxyPredictionNotificationTest.class'
            include '**/VoxyNativeFaceContractTest.class'
            forkEvery=1
            maxHeapSize='2G'
            systemProperty 'vss.voxyJar', providers.gradleProperty('vssVoxyJar').get()
            testLogging {events 'failed','skipped';exceptionFormat 'full';showStandardStreams=true}
        }
    }
}
