// Isolated experiment classes only; avoid forking all test classes for discovery.
allprojects {
    tasks.withType(Test).configureEach {
        include "**/${providers.gradleProperty('vssExperiment').get()}.class"
        forkEvery = 1
        maxParallelForks = 1
        outputs.upToDateWhen { false }
        systemProperty 'vss.gpuTests', 'true'
        if (providers.gradleProperty('vssGpuCorpus').isPresent())
            systemProperty 'vss.gpuCorpus', providers.gradleProperty('vssGpuCorpus').get()
        if (providers.gradleProperty('vssSeamCorpus').isPresent())
            systemProperty 'vss.seamCorpus', providers.gradleProperty('vssSeamCorpus').get()
        if (providers.gradleProperty('vssMountainDocument').isPresent())
            systemProperty 'vss.mountainDocument', providers.gradleProperty('vssMountainDocument').get()
        testLogging { showStandardStreams = true; exceptionFormat = 'full' }
    }
}
