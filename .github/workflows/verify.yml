name: Verify modules

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Forge targets Java 17; Gradle and NeoForge run with Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Module boundaries and CPU regressions
        run: .\gradlew.bat -I tools/verification/performance-regression.gradle verifyModules planningConsumerTest performanceRegressionTest --no-daemon
      - name: Terrain handoff and End generation regressions
        run: .\gradlew.bat -I tools/verification/dirty-handoff.gradle -I tools/verification/end-decoration.gradle dirtyHandoffTest endDecorationTest --no-daemon
      - name: Package mod (Forge also reobfuscates)
        run: .\gradlew.bat jar "-PvssBuildId=ci-${{ github.sha }}" --no-daemon
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn
      - name: Save mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: lib/*.jar
          if-no-files-found: error
